<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Museo AR</title>
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <style>
      #playButton {
        position: fixed;
        top: 20px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 9999;
        padding: 14px 28px;
        background-color: #007bff;
        color: white;
        border: none;
        border-radius: 30px;
        font-size: 16px;
        font-family: sans-serif;
        font-weight: bold;
        box-shadow: 0 4px 8px rgba(0,0,0,0.4);
        cursor: pointer;
      }
    </style>
  </head>
  <body style="margin: 0; overflow: hidden;">

    <button id="playButton">Toca aquí para iniciar</button>
    
    <a-scene 
      mindar-image="imageTargetSrc: ./cuadro.mind;" 
      color-space="sRGB" 
      renderer="colorManagement: true, physicallyCorrectLights" 
      vr-mode-ui="enabled: false" 
      device-orientation-permission-ui="enabled: false">
      
      <a-assets>
        <video 
          id="miVideo" 
          src="./video.mp4" 
          preload="auto" 
          loop 
          muted
          crossorigin="anonymous" 
          webkit-playsinline 
          playsinline>
        </video>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <a-entity mindar-image-target="targetIndex: 0">
        <a-video src="#miVideo" width="1" height="0.75" position="0 0 0"></a-video>
      </a-entity>
      
    </a-scene>

    <script>
      const playBtn = document.querySelector('#playButton');
      const video = document.querySelector('#miVideo');
      const sceneEl = document.querySelector('a-scene');

      // Al tocar el botón habilitamos el audio y dejamos listo el video
      playBtn.addEventListener('click', () => {
        video.muted = false; // Le quitamos el silencio tras la interacción del usuario
        video.play().then(() => {
          video.pause(); // Lo pausamos hasta que la cámara encuentre el cuadro
        }).catch(err => console.log("Error al activar video:", err));
        
        playBtn.style.display = 'none'; // Ocultamos el botón
      });

      // Control de reproducción según tracking
      sceneEl.addEventListener("arReady", () => {
        const target = document.querySelector('[mindar-image-target]');
        
        target.addEventListener("targetFound", () => { 
          video.play(); 
        });
        
        target.addEventListener("targetLost", () => { 
          video.pause(); 
        });
      });
    </script>
  </body>
</html>
